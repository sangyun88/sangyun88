<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>면접 시뮬레이션 오디오</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#f6f5f2; --surface:#fff; --text:#1d1d1f; --muted:#6e6e73; --line:#e6e4df;
  --her:#c2410c; --her-bg:#fff4ed; --me:#1d4ed8; --me-bg:#eef3ff; --accent:#1d1d1f;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121212; --surface:#1c1c1e; --text:#f2f2f2; --muted:#9a9aa0; --line:#2c2c2e;
    --her:#fb923c; --her-bg:#2a1d14; --me:#7aa2ff; --me-bg:#161f33; --accent:#f2f2f2; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 200px}
header h1{font-size:22px;margin:8px 0 4px;letter-spacing:-.02em}
header p{margin:0;color:var(--muted);font-size:14px}
.legend{display:flex;gap:14px;margin:14px 0 8px;font-size:13px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.q{margin:28px 0 0}
.q h2{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 10px;cursor:pointer;display:flex;gap:8px;align-items:center}
.q h2 .n{font-variant-numeric:tabular-nums;color:var(--text)}
.turn{border-radius:14px;padding:12px 14px;margin:8px 0;line-height:1.7;font-size:16px;cursor:pointer;
  border:1px solid transparent;transition:background .2s,border-color .2s;white-space:pre-line}
.turn .who{display:block;font-size:12px;font-weight:700;margin-bottom:2px}
.turn.interviewer .who{color:var(--her)}
.turn.me .who{color:var(--me)}
.turn.interviewer{margin-right:12%}
.turn.me{margin-left:6%}
.turn.active.interviewer{background:var(--her-bg);border-color:var(--her)}
.turn.active.me{background:var(--me-bg);border-color:var(--me)}
.turn:not(.active){opacity:.72}
.player{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.player .in{max-width:720px;margin:0 auto}
.now{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:8px}
.now b{color:var(--text)}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:10px;cursor:pointer}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.ctrls{display:flex;align-items:center;justify-content:space-between;gap:8px}
.btns{display:flex;align-items:center;gap:6px}
button{font:inherit;color:var(--text);background:none;border:0;cursor:pointer;border-radius:999px;padding:8px}
button:hover{background:var(--line)}
.play{width:52px;height:52px;background:var(--accent);color:var(--bg);display:grid;place-items:center}
.play:hover{background:var(--accent);opacity:.9}
.opts{display:flex;gap:6px;align-items:center;font-size:13px}
.chip{border:1px solid var(--line);padding:6px 10px;font-size:13px}
.chip.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
svg{display:block}
.hint{font-size:12px;color:var(--muted);margin-top:6px;min-height:1em}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p>🎧 듣기용 답변</p>
    <h1>카카오뱅크 신사업기획 면접 시뮬레이션</h1>
    <p><span id="qcount"></span> · 문장을 누르면 거기서부터 재생돼요</p>
    <div class="legend"><span><i class="dot" style="background:var(--her)"></i>면접관</span><span><i class="dot" style="background:var(--me)"></i>나</span></div>
  </header>
  <main id="list"></main>
</div>

<div class="player"><div class="in">
  <div class="now" id="now">재생을 눌러 시작하세요</div>
  <div class="bar" id="bar"><i id="prog"></i></div>
  <div class="ctrls">
    <div class="btns">
      <button id="prevQ" aria-label="이전 질문"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button class="play" id="play" aria-label="재생"><svg id="icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
      <button id="nextQ" aria-label="다음 질문"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
    </div>
    <div class="opts">
      <button class="chip" id="speed">1.0×</button>
      <button class="chip" id="practice" title="면접관 질문 뒤에 멈춰서 직접 답해볼 수 있어요">연습 모드</button>
    </div>
  </div>
  <div class="hint" id="hint"></div>
</div></div>

<audio id="au" preload="auto"></audio>
<script>
const DATA = [{"no": 1, "title": "본인 소개", "turns": [{"speaker": "interviewer", "text": "간단히 본인 소개 부탁드립니다.", "audio": "audio/interviewer_1e03543bc2.mp3"}, {"speaker": "me", "text": "안녕하세요. 이상윤입니다.\n현재 SK플래닛에서 UX 기획 업무를 맡고 있습니다. 전력 솔루션으로 시작해서, 앱테크 서비스인 시럽에서는 금 투자 서비스를 맡았고, 만보기 서비스인 오락을 거쳐 지금은 커머스 서비스인 OK캐쉬백 쇼핑을 만들고 있습니다. 이처럼 도메인이 바뀔 때마다 그 시장을 깊게 스터디하여 제 것으로 만드는 방식으로 일을 해왔습니다.\n카카오뱅크 신사업기획 모집요강에서 특정 도메인보다 새로운 분야를 깊게 파고드는 호기심을 보신다는 문장이 눈에 들어왔습니다. 사용자를 먼저 생각하는 카카오뱅크의 방식과 UX를 바탕으로 사용자 경험을 고려하여 일해온 제 경험이 잘 맞을 것 같아 지원하게 되었습니다.", "audio": "audio/me_612fe66b95.mp3"}]}, {"no": 2, "title": "현재 조직과 역할", "turns": [{"speaker": "interviewer", "text": "현재 조직은 어떻게 구성되어 있고, 그 안에서 어떤 역할을 하시나요?", "audio": "audio/interviewer_f9f29c6b2f.mp3"}, {"speaker": "me", "text": "플랫폼사업그룹 안에 Vertical UX팀에 소속되어있고, UX팀은 UX기획과 GUI디자인 역할로 구분되어있습니다.\n서비스 기획은 사업기획팀이 담당합니다. 사업기획팀은 무엇을, 왜 할지를 정합니다. 제휴사와 조건을 협의하고, 수익 구조와 상위 기획을 잡습니다.\nUX기획은 사업기획팀이 정한 방향을 사용자가 실제로 쓰는 서비스로 어떻게 풀어낼지 설계합니다. 상위 기획 단계부터 같이 아이데이션해서 방향을 잡고, Flow와 화면, 정책을 설계해서 UID를 작성하여 GUI와 개발, QA까지 넘깁니다.\n다만 경계가 칼같지는 않습니다. OK캐쉬백 쇼핑 프로젝트는 사업기획팀이 결정했지만, 누구를 타겟으로 어떤 컨셉으로 갈지는 UX에서 데이터를 보고 제안했습니다.\n카카오뱅크 신사업기획팀은 저희 회사에서 두 팀이 나눠 하는 일을 한 사람이 맡는 자리라고 이해했습니다. 뒤쪽 절반은 제가 가장 오래 해온 일이고, 앞쪽 절반은 걸쳐서 일하면서 더 해보고 싶어진 일입니다.", "audio": "audio/me_717721b582.mp3"}, {"speaker": "interviewer", "text": "그럼 PM 역할은 안 해보신 거네요?", "audio": "audio/interviewer_5fdebc656f.mp3"}, {"speaker": "me", "text": "프로젝트 전체를 PM으로 끌고 간 경험은 없습니다. 대신 오락 리브랜딩에서 UX PL을 맡았습니다. 저를 포함한 UX 기획 2명, GUI 2명, 네 명을 리드했습니다.", "audio": "audio/me_9b8029ace7.mp3"}]}, {"no": 3, "title": "직함과 기획 경력", "turns": [{"speaker": "interviewer", "text": "기획 경력이라고 쓰셨는데, 실제 직함은 디자이너 아닌가요?", "audio": "audio/interviewer_7ffe60a23b.mp3"}, {"speaker": "me", "text": "맞습니다. 직군은 UX입니다.\n다만 저희 UX팀은 UX 기획과 GUI 디자인이 직무로 나뉘어 있고, 제가 맡은 쪽은 UX 기획입니다. 산출물 중에 UID가 있습니다. 화면마다 상태를 정의하고, 분기 조건과 예외 케이스, 에러 상황까지 개발자가 그대로 구현할 수 있는 수준으로 작성합니다. QA도 UID를 기준으로 검증합니다.", "audio": "audio/me_9066f33267.mp3"}, {"speaker": "interviewer", "text": "UX디자인도 계속 하고 싶으신가요?", "audio": "audio/interviewer_897fe5de27.mp3"}, {"speaker": "me", "text": "설계 단계에서 화면을 직접 그릴 수 있는 건 제 장점이라고 생각합니다. 다만 앞으로는 더 넓은 범위에서 문제를 정의하고, 기획한 결과를 지표로 책임지는 일을 하고 싶습니다.", "audio": "audio/me_b0a7560ddb.mp3"}]}, {"no": 4, "title": "가장 자신 있는 프로젝트", "turns": [{"speaker": "interviewer", "text": "가장 자신 있는 프로젝트 하나를 처음부터 끝까지 설명해주세요.", "audio": "audio/interviewer_aa577272ae.mp3"}, {"speaker": "me", "text": "오락 리브랜딩 프로젝트입니다.\n시작은 정량적인 데이터로 신규 가입 전환율이 지속적으로 떨어지는 문제를 발견하였습니다. 이후 정성적인 데이터로 FGI를 진행하였습니다. 잠금화면 앱테크를 쓰는 사람과 안 쓰는 사람, 두 그룹 8명을 인터뷰하였습니다. 인사이트로는 보상이 커서 들어오는 유저는 체리피커의 그룹으로 신규 사용자를 넓히기 어려웠습니다. 반면 어차피 많이 걸으니 포인트도 받으면 이득이라는 사람들처럼, 서비스 자체에서 쓸 이유를 찾는 사람들이 신규를 늘리는 데 더 유리하다고 봤습니다.\n그래서 가치소비 트렌드에서 미닝워크라는 컨셉을 가져왔습니다. 걷는 데 의미를 붙이는 거죠. 친환경 만보기로 방향을 잡고, 환경오염의 주범인 탄소를 탄소몬이라는 몬스터로 만들었습니다. 친환경 미션을 하면 탄소몬을 무찌르는 구조입니다. 보상 말고도 재미와 의미라는 참여 이유를 하나 더 만든 셈입니다.\n배포 직후에는 관성적으로 사용하던 헤비 유저 일부가 빠지면서 MAU가 줄었습니다. 하지만 신규사용자들이 늘어나면서 1개월만에 회복했고 3개월 만에 신규 MAU가 8.3%, 신규 재방문율이 5.8% 올랐습니다. LTV가 높은 2030 비중도 12% 늘었습니다. 별도 마케팅은 진행하지 않고 만들어낸 지표입니다.\n타겟을 제대로 다시 잡으니 지표 여러 개가 같이 움직였습니다.", "audio": "audio/me_6c02033f9d.mp3"}, {"speaker": "interviewer", "text": "FGI는 어떻게 나눠서 하셨나요?", "audio": "audio/interviewer_1ddf3ff3a6.mp3"}, {"speaker": "me", "text": "두 그룹으로 4명씩 만났습니다. 오락은 잠금화면이 핵심인 서비스라서, 잠금화면 앱테크를 이미 쓰는 사람과 일반 앱테크만 쓰는 사람을 나눴습니다. 아직 안 쓰는 사람이 왜 안 들어오는지가 더 궁금했기 때문입니다.", "audio": "audio/me_f84cc3792e.mp3"}, {"speaker": "interviewer", "text": "헤비 유저가 빠진 건 괜찮았나요?", "audio": "audio/interviewer_62809e1e40.mp3"}, {"speaker": "me", "text": "리브랜딩의 목표가 신규 유입이었습니다. 신규 가입 전환율이 떨어지던 게 출발점이었으니까요. 기존 사용자 일부가 빠지는 건 어느 정도 예상했고, 그보다 신규가 더 많이 들어오는지를 지켜봤습니다.", "audio": "audio/me_82f23f0e29.mp3"}, {"speaker": "interviewer", "text": "탄소몬은 실제로 반응이 있었나요?", "audio": "audio/interviewer_313a0a7fd8.mp3"}, {"speaker": "me", "text": "이후 홈과 하단 탭을 개편하면서 탄소몬 잡기를 앞으로 꺼냈는데, PV가 24.9% 늘었습니다. 메인 기능인 오늘, 걸음보다 증가 폭이 컸습니다.", "audio": "audio/me_369b31e4d2.mp3"}]}, {"no": 5, "title": "쇼핑탭에서 한 일", "turns": [{"speaker": "interviewer", "text": "쇼핑탭에서 본인이 한 일은 무엇인가요?", "audio": "audio/interviewer_a731f39e74.mp3"}, {"speaker": "me", "text": "쇼핑 기능이 여러 탭에 흩어져 있어서, 상품이 한 눈에 보이지 않고 구매 흐름이 단절되는 구조였습니다. 등급별로 보니 포인트는 쌓이는데 쓸 곳을 모르는 M/L 고객이 가장 반응할 가능성이 컸습니다. 그래서 목적 없이 들어와도 피드에서 상품을 발견하고, 포인트가 할인처럼 느껴지게 결제하는 쇼핑을 컨셉으로 잡았습니다.\n오픈 후 별도 마케팅 없이 신규 사용자 UV가 14%, 휴면 사용자 방문 수가 28% 늘었습니다.", "audio": "audio/me_8b4dfe5bef.mp3"}, {"speaker": "interviewer", "text": "쇼핑 UV 45%는 흩어져 있던 트래픽이 모인 것 아닌가요?", "audio": "audio/interviewer_75a50031d5.mp3"}, {"speaker": "me", "text": "그런 부분도 있습니다. 다만 휴면 사용자의 방문 수가 늘어난 걸 보면, 타겟으로 잡은 M/L 고객에게 효과가 있었다고 봅니다.", "audio": "audio/me_bf54091839.mp3"}]}, {"no": 6, "title": "전환율 72% 상승", "turns": [{"speaker": "interviewer", "text": "전환율 72% 상승이 정말 그 개선 때문인가요?", "audio": "audio/interviewer_2b87807a49.mp3"}, {"speaker": "me", "text": "전환율이 3.99%에서 6.86%로 올랐습니다. 다만 같은 시기에 첫구매 고객 대상 프로모션이 있었습니다. 순수하게 화면 효과만은 아닙니다.\n그런데 프로모션이 끝난 뒤에도 전환율은 소폭만 내려갔습니다. 프로모션만의 효과였다면 원래 수준으로 돌아갔을 겁니다. 그래서 화면 개선 효과가 상당 부분 남아 있다고 봅니다.", "audio": "audio/me_1f12fc10e4.mp3"}]}, {"no": 7, "title": "공동구매 예측 툴", "turns": [{"speaker": "interviewer", "text": "공동구매 예측 툴을 어떻게 만드셨나요?", "audio": "audio/interviewer_78905be312.mp3"}, {"speaker": "me", "text": "운영 담당자가 실적 엑셀을 올리면, 툴이 그 파일을 참조해서 최신 사례까지 반영해 판단합니다. LLM 노코드 툴에 OpenAI API로 GPT를 연결해서 만들었고, Cowork에 1주일 주기로 스케줄을 걸어서 자동 업데이트되게 연결했습니다. 모델을 학습시킨 건 아니고, 과거 실적을 참조하게 만든 판단 보조 도구입니다.\n정확도는 따로 측정하지 않았습니다. 정답이 있는 문제가 아니었고, 담당자 경험에만 의존하던 판단에 근거를 하나 더 얹는 게 목적이었습니다.\n개발 리소스를 요청할 만큼 큰 일이 아니어서 직접 만들었습니다.", "audio": "audio/me_db2703d1ad.mp3"}]}, {"no": 8, "title": "추천 시스템 논문", "turns": [{"speaker": "interviewer", "text": "추천 시스템 논문은 어떤 걸 읽으셨나요?", "audio": "audio/interviewer_d058aa77fe.mp3"}, {"speaker": "me", "text": "장단기 관심사를 다루는 논문 위주로 봤습니다. 오래 가는 핵심 관심사가 있고, 최근에 생긴 관심사는 1~2주 안에 끝나기도 하지만, 반복되면 장기 관심사로 이어지기도 한다는 내용입니다.", "audio": "audio/me_ca3ca0f21a.mp3"}]}, {"no": 9, "title": "SQL 직접 vs 요청", "turns": [{"speaker": "interviewer", "text": "SQL을 직접 뽑는 일과 데이터 조직에 요청하는 일의 기준이 뭔가요?", "audio": "audio/interviewer_766f541269.mp3"}, {"speaker": "me", "text": "요즘은 LLM 덕분에 대부분의 SQL은 직접 짜서 봅니다. 매출이나 개인정보와 연관된 데이터는 데이터 조직에 요청합니다.", "audio": "audio/me_d9efd1dd29.mp3"}]}, {"no": 10, "title": "정량과 정성의 충돌", "turns": [{"speaker": "interviewer", "text": "정량과 정성이 서로 다른 답을 가리켰던 적이 있나요?", "audio": "audio/interviewer_fa02a2c821.mp3"}, {"speaker": "me", "text": "숫자는 어디서 문제가 생기는지를 알려주고, 인터뷰는 왜 그런지를 알려준다고 봅니다. 둘이 어긋나면 대개 숫자를 잘못 읽었거나, 인터뷰 대상이 그 숫자를 만든 사람이 아닌 경우입니다. 그래서 두 데이터가 같은 사용자 집단을 보고 있는지부터 확인합니다.", "audio": "audio/me_64e7c3e9bb.mp3"}]}, {"no": 11, "title": "야금야금 UT", "turns": [{"speaker": "interviewer", "text": "야금야금 UT는 몇 명에게, 무엇을 검증하셨나요?", "audio": "audio/interviewer_3772071f0a.mp3"}, {"speaker": "me", "text": "6명을 만났습니다. 투자에 관심 있는 신규 사용자 4명, 야금야금을 가볍게 쓰던 사용자 2명입니다. v1.0에 명품 조각이나 가상자산 같은 제휴 상품이 붙으면서 설계가 바뀌어서, 가설 다섯 개를 세우고 들어갔습니다.\n가장 크게 배운 건 정보가 부족할 거라는 가설이 반만 맞았다는 점입니다. 투자에 익숙한 사람은 판단할 정보가 모자라다고 했습니다. 그런데 경험이 적은 사람은 그 전 단계에서 막혔습니다. 명품 조각, 오픈런 같은 말부터 이해하지 못했고, 판단할 때는 다른 사용자들의 반응을 찾았습니다.\n그래서 설명을 늘리기보다, 개념은 꼭 필요한 것만 쉽게 풀고 시세는 분석된 결과로 보여주는 쪽으로 방향을 잡았습니다.", "audio": "audio/me_f02659611d.mp3"}]}, {"no": 12, "title": "자소서의 '불안'", "turns": [{"speaker": "interviewer", "text": "자소서에 사용자가 불안 때문에 멈췄다고 쓰셨는데요.", "audio": "audio/interviewer_c0e38868a5.mp3"}, {"speaker": "me", "text": "자소서에서는 압축하다 보니 불안이라고 썼습니다. 정확히 말하면, 투자 경험에 따라 판단 기준이 달랐습니다. 경험이 많은 사람은 정보가 부족하다고 했고, 적은 사람은 용어부터 막혔습니다.", "audio": "audio/me_c36ab09a66.mp3"}]}, {"no": 13, "title": "포인트 vs 현금 서비스", "turns": [{"speaker": "interviewer", "text": "포인트 기반 서비스와 현금 기반 서비스, 기획할 때 뭐가 다른가요?", "audio": "audio/interviewer_a6f3aa2f67.mp3"}, {"speaker": "me", "text": "포인트는 심리적 장벽이 낮습니다. 공짜로 얻은 돈이라는 감각이 있어서 첫 시도가 쉽습니다. 대신 쉽게 쓰는 만큼 쉽게 떠납니다. 그래서 포인트 서비스는 재방문 설계가 핵심이었습니다.\n현금은 반대입니다. 첫 진입이 어렵고, 대신 한 번 시작하면 오래 갑니다. 그래서 초기 신뢰 설계가 더 중요하다고 봅니다. 금액이 어떻게 계산되는지, 지금 내 돈이 어떤 상태인지가 매 단계 보여야 합니다.\n제가 해온 건 포인트 쪽이지만, 사용자가 멈추는 지점은 비슷했습니다. 금액이 불확실할 때였습니다.", "audio": "audio/me_47e4d5ae54.mp3"}]}, {"no": 14, "title": "e금 vs 금 모으기", "turns": [{"speaker": "interviewer", "text": "야금야금의 e금과 카카오뱅크 금 모으기는 어떻게 다르다고 보시나요?", "audio": "audio/interviewer_17bc86886d.mp3"}, {"speaker": "me", "text": "가장 큰 차이는 순환이 되느냐라고 봅니다.\n제가 진행했던 야금야금은 사고파는 게 계속 이어집니다. 끝나는 지점이 없습니다. 반면 카카오뱅크의 금 모으기는 26주 뒤에 목표 중량에 도달하고, 보관하거나 팔거나 실물로 받습니다. 목표가 있는 상품입니다.\n그래서 설계 포인트가 다르다고 봅니다. e금은 시세를 계속 확인하게 만드는 게 중요했다면, 금 모으기는 26주를 완주하게 만드는 게 중요할 것 같습니다.", "audio": "audio/me_f272a57767.mp3"}]}, {"no": 15, "title": "카카오뱅크가 풀어야 할 문제", "turns": [{"speaker": "interviewer", "text": "여행, 하이패스, 금, 보험 중 하나를 골라 지금 카카오뱅크가 풀어야 할 문제를 짚어 주세요.", "audio": "audio/interviewer_44c34b4868.mp3"}, {"speaker": "me", "text": "밖에서 본 거라 틀릴 수도 있습니다.\n먼저 금 모으기는 26주적금이라는 카카오뱅크만의 방식을 실물 금에 얹은 점이 좋았습니다. 목표 중량을 정하고 26주 동안 자동이체로 모으는 구조요.\n개선한다면, 자동이체가 나가는 동안 시세를 확인할 수 있게 하고, 투자 금액도 어느 정도 고를 수 있게 하겠습니다. 시세가 떨어질 때 자동이체가 계속 나가면 불안한 분들도 있을 텐데, 그 불안이 오히려 앱을 한 번 더 열어보는 이유가 될 수 있습니다.\n그리고 26주를 완주하면 보관하거나, 팔거나, 실물로 받습니다. 셋 다 거기서 끝나는 선택입니다. 여기서 다음 투자로 이어서 복리로 모을 수 있게, 서비스를 연장하는 방향도 고려해보겠습니다.", "audio": "audio/me_85739cc969.mp3"}, {"speaker": "interviewer", "text": "여행으로 답한다면요?", "audio": "audio/interviewer_12569c0fab.mp3"}, {"speaker": "me", "text": "둘러보기만 해도 하루 1회 리워드를 주는 구조는 방문을 만듭니다. 다만 방문과 예약 전환은 별개입니다. 해외 패키지는 고민 기간이 길고 혼자 결정하지 않습니다. 실제로 예약하면 금액에 따라 추가 적립 혜택을 붙여보겠습니다.", "audio": "audio/me_bd4810967e.mp3"}]}, {"no": 16, "title": "은행 앱의 비금융 서비스", "turns": [{"speaker": "interviewer", "text": "은행 앱에 비금융 서비스가 들어가는 게 왜 필요하다고 보시나요?", "audio": "audio/interviewer_ea5bf03d2a.mp3"}, {"speaker": "me", "text": "은행 앱은 볼일이 있을 때만 엽니다. 이체하고 잔액 보고 닫습니다. 그래서 오늘 이 앱을 열 이유가 필요하다고 봅니다.\n비금융 서비스가 그 이유를 만듭니다. 다만 아무거나 붙이면 안 되고, 돈 쓰는 맥락과 이어져야 한다고 봅니다. 여행은 예약하면서 환전이 필요하고, 하이패스는 충전이 붙고, 금은 그 자체가 자산입니다. 금융으로 자연스럽게 이어지는 생활 영역이 맞는 것 같습니다.", "audio": "audio/me_42dc143c1a.mp3"}]}, {"no": 17, "title": "제휴 서비스에서 기획자의 역할", "turns": [{"speaker": "interviewer", "text": "제휴 서비스는 경험 대부분을 제휴사가 만듭니다. 그 구조에서 기획자 역할이 뭘까요?", "audio": "audio/interviewer_87337d166b.mp3"}, {"speaker": "me", "text": "번역이라고 생각합니다. 제휴사 상품 구조를 그대로 가져오면 그 회사 앱이 되지, 카카오뱅크가 되지 않습니다.\n금 모으기가 좋은 예라고 봅니다. 금방 입장에서는 금 분할 매수 상품이지만, 카카오뱅크 안에서는 26주적금 문법으로 번역됐습니다. 사용자는 이미 아는 방식으로 새 상품을 씁니다.\n그리고 이음새를 책임지는 것도 기획자 몫이라고 봅니다. 제휴 서비스는 경계에서 문제가 생깁니다. 어디까지가 우리 책임인지 사용자는 모르니까요.\nOK캐쉬백 쇼핑도 제휴사 상품을 앱 안에 들이는 구조였습니다.", "audio": "audio/me_87f6fe7162.mp3"}]}, {"no": 18, "title": "아이디어 판단 기준", "turns": [{"speaker": "interviewer", "text": "아이디어 단계에서 된다 안 된다를 무엇으로 판단하시나요?", "audio": "audio/interviewer_aa89d2d295.mp3"}, {"speaker": "me", "text": "이미 그 행동을 하고 있는 사람이 있느냐를 봅니다. 다른 데서라도요. 없는 행동을 새로 만드는 건 어렵지만, 이미 하는 걸 편하게 만드는 건 됩니다.\n그 다음은 수익 구조입니다. 줄 수 있는 것의 크기가 정해져 있으면 기획 범위도 거기서 정해집니다. 단가를 모르고 설계하면 나중에 다 뒤집힙니다.", "audio": "audio/me_266e59389f.mp3"}]}, {"no": 19, "title": "데이터 없는 신사업의 문제 정의", "turns": [{"speaker": "interviewer", "text": "신사업은 데이터가 없는 상태에서 시작합니다. 그럴 때 어떻게 문제를 정의하시나요?", "audio": "audio/interviewer_d1598353f1.mp3"}, {"speaker": "me", "text": "우리 데이터가 없을 뿐이지, 비슷한 행동의 데이터는 어딘가에 있다고 봅니다. 같은 시장의 기존 서비스, 공개된 시장 자료, 유사 상품의 이용 패턴이요.\n그 다음은 사람에게 직접 확인합니다. 오락은 FGI로 사용자 유형부터 다시 잡았고, 야금야금은 UT로 가설을 확인했습니다. 숫자가 없으면 사람에게 물어보는 게 맞다고 봅니다.", "audio": "audio/me_b42e1771c3.mp3"}]}, {"no": 20, "title": "의견이 받아들여지지 않을 때", "turns": [{"speaker": "interviewer", "text": "본인 의견이 받아들여지지 않았을 때는 어떻게 하시나요?", "audio": "audio/interviewer_4b27414dc7.mp3"}, {"speaker": "me", "text": "먼저 수용적으로 받아들입니다. 다른 의견에도 나름의 이유가 있다고 생각하니까요.\n다만 그대로 넘어가지는 않고, 데이터나 직접 경험해볼 수 있는 다른 기준으로 판단해보려고 합니다. 지표를 같이 보거나, 작게 먼저 해보고 반응을 확인하는 식입니다. 기준이 있으면 감정 싸움 없이 결과를 보고 이야기할 수 있습니다.", "audio": "audio/me_add0a27348.mp3"}]}, {"no": 21, "title": "이직 사유", "turns": [{"speaker": "interviewer", "text": "왜 지금 이직을 결심하셨나요?", "audio": "audio/interviewer_13e789b142.mp3"}, {"speaker": "me", "text": "지금 회사에 불만이 있어서는 아닙니다. 쇼핑 영역을 맡아 지표도 나오고 있고, 일하는 환경도 괜찮습니다.\n다만 제가 맡는 범위가 정해져 있습니다. 어떤 제휴사와 어떤 상품을 붙일지는 사업팀이 정하고, 저는 그게 정해진 다음부터 들어갑니다. 어떻게 만들지는 제가 정하는데, 만들지 말지는 제 몫이 아닙니다.\n결제 화면 개선을 하면서 그 선이 더 뚜렷하게 보였습니다. 지표를 보고 문제를 찾아 고쳤더니 전환율이 올랐는데, 그 경험이 재미있었습니다. 그러면서 이걸 화면 단위가 아니라 서비스 단위로 하면 어떨까 하는 생각이 들었습니다.\n신사업기획팀은 아이디어를 찾는 단계부터 출시하고 고치는 단계까지 한 사람이 맡는다고 되어 있었습니다. 제가 다음으로 하고 싶은 일이 그겁니다.", "audio": "audio/me_8134f59ba0.mp3"}, {"speaker": "interviewer", "text": "지금 회사에서 그 역할로 옮길 수는 없나요?", "audio": "audio/interviewer_644db9ff0c.mp3"}, {"speaker": "me", "text": "조직 구조상 기획 직무는 별도 조직에 있습니다. 옮기려면 직군 자체를 바꿔야 하는데, 그렇게 되면 지금까지 쌓은 설계 역량을 살리기 어려운 구조였습니다.", "audio": "audio/me_73e4370020.mp3"}, {"speaker": "interviewer", "text": "연봉 때문은 아닌가요?", "audio": "audio/interviewer_4143c16cdb.mp3"}, {"speaker": "me", "text": "처우도 당연히 고려합니다. 다만 그게 첫 번째 이유였다면 다른 선택지도 있었습니다.", "audio": "audio/me_1ef2503302.mp3"}, {"speaker": "interviewer", "text": "지금 회사에서 아쉬운 점은 뭔가요?", "audio": "audio/interviewer_b8e551646e.mp3"}, {"speaker": "me", "text": "앞서 말씀드린 것처럼 역할이 나뉘어 있다는 점입니다. 그 대신 설계 전문성은 깊게 쌓을 수 있었습니다.", "audio": "audio/me_942f2d4bb2.mp3"}]}, {"no": 22, "title": "왜 카카오뱅크인가", "turns": [{"speaker": "interviewer", "text": "왜 카카오뱅크인가요? 다른 곳도 보고 계신가요?", "audio": "audio/interviewer_9085063b94.mp3"}, {"speaker": "me", "text": "다른 곳도 보고 있습니다. 다만 이 팀은 작년에도 지원했고, 다시 지원했습니다.\n카카오뱅크를 보는 이유는 금융 앱인데 금융만 하지 않는다는 점입니다. 생활 영역의 서비스를 앱 안에 들이면서도 카카오뱅크답게 만들어냅니다. 제가 해온 일이 그 지점과 가깝다고 생각합니다.", "audio": "audio/me_e9d1749ed4.mp3"}]}, {"no": 23, "title": "재지원", "turns": [{"speaker": "interviewer", "text": "작년에도 저희 팀에 지원하셨던데요.", "audio": "audio/interviewer_d09832329c.mp3"}, {"speaker": "me", "text": "사실 작년에도 이 팀에 지원했다가 실무면접에서 떨어졌습니다. 그때 시니어면 사업부터 할 줄 알아야 한다는 말씀을 주셨고, 맞는 말씀이라고 생각했습니다.\n그 뒤로 의식적으로 범위를 넓혔습니다. 현재 쿠팡스탬프라는 경유쇼핑적립 서비스를 개선하고 있는데, 제휴 계약 조건부터 파악하고 들어갔습니다. 유입 경로와 구매 상품에 따라 정산 단가가 달라지는 구조입니다.\n기존에는 리워드 종류가 너무 많아서 오히려 눈에 띄는 리워드가 없었습니다. 그래서 스탬프 하나당 단가를 역산해서, 같은 비용으로 더 눈길을 끌 수 있는 리워드로 다시 구성했습니다. 이렇게 사업 영역까지 조금씩 범위를 넓혀가고 있습니다.", "audio": "audio/me_74d61ace49.mp3"}]}, {"no": 24, "title": "5년 뒤", "turns": [{"speaker": "interviewer", "text": "5년 뒤 어떤 사람이 되어 있고 싶으신가요?", "audio": "audio/interviewer_2d90c0f7cf.mp3"}, {"speaker": "me", "text": "서비스 하나를 처음부터 끝까지 책임져본 사람이 되어 있고 싶습니다. 지금은 기능 단위까지입니다.\n그리고 고객의 하루에 남는 서비스를 만들고 싶습니다. 열 이유가 있는 앱이요.", "audio": "audio/me_04e43be4f3.mp3"}]}];
const turns = [];
DATA.forEach(q => q.turns.forEach(t => turns.push({...t, q})));

const $ = id => document.getElementById(id);
const au = $('au'), list = $('list');
const SPEEDS = [0.8, 0.9, 1.0, 1.1, 1.25, 1.5];
const store = { get(k, d){ try{ const v = localStorage.getItem('iv_'+k); return v===null?d:JSON.parse(v) }catch(e){ return d } },
                set(k, v){ try{ localStorage.setItem('iv_'+k, JSON.stringify(v)) }catch(e){} } };
let idx = Math.min(store.get('idx', 0), turns.length - 1);
let speed = store.get('speed', 1.0), practice = store.get('practice', false);
let playing = false, gapTimer = null;

// 렌더
turns.forEach((t, i) => {
  if (!t.q._el) {
    const sec = document.createElement('section'); sec.className = 'q';
    sec.innerHTML = `<h2><span class="n">Q${t.q.no}</span>${t.q.title}</h2>`;
    sec.querySelector('h2').onclick = () => go(i, true);
    list.appendChild(sec); t.q._el = sec;
  }
  const d = document.createElement('div');
  d.className = 'turn ' + t.speaker;
  d.innerHTML = `<span class="who">${t.speaker === 'interviewer' ? '면접관' : '나'}</span>`;
  d.appendChild(document.createTextNode(t.text));
  d.onclick = () => go(i, true);
  t.el = d; t.q._el.appendChild(d);
});

function mark(scroll){
  turns.forEach((t, i) => t.el.classList.toggle('active', i === idx));
  const t = turns[idx];
  $('now').innerHTML = `<b>Q${t.q.no}</b> · ${t.q.title} · ${t.speaker === 'interviewer' ? '면접관' : '나'}`;
  if (scroll) t.el.scrollIntoView({behavior:'smooth', block:'center'});
  store.set('idx', idx);
  if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({
    title: `Q${t.q.no}. ${t.q.title}`, artist: t.speaker === 'interviewer' ? '면접관' : '나', album: '면접 시뮬레이션'});
}
function setIcon(){
  $('icon').innerHTML = playing ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
  $('play').setAttribute('aria-label', playing ? '일시정지' : '재생');
}
function load(i){ idx = i; au.src = turns[i].audio; au.playbackRate = speed; mark(true); }
function go(i, play){
  clearTimeout(gapTimer); $('hint').textContent = '';
  if (i < 0 || i >= turns.length) { playing = false; setIcon(); return; }
  load(i); if (play) { playing = true; au.play().catch(()=>{ playing=false; setIcon(); }); } setIcon();
}
au.addEventListener('ended', () => {
  const cur = turns[idx], nxt = turns[idx + 1];
  if (!nxt) { playing = false; setIcon(); $('hint').textContent = '끝까지 들으셨어요 👏'; return; }
  if (practice && cur.speaker === 'interviewer' && nxt.speaker === 'me') {
    load(idx + 1); playing = false; setIcon();
    $('hint').textContent = '직접 답해보세요. 준비되면 ▶︎를 눌러 모범 답변을 들어요.'; return;
  }
  // 화자 전환·질문 전환 사이에 자연스러운 쉼
  const pause = nxt.q !== cur.q ? 1400 : 650;
  gapTimer = setTimeout(() => go(idx + 1, true), pause / speed);
});
au.addEventListener('error', () => { playing = false; setIcon(); $('hint').textContent = '오디오를 불러오지 못했어요.'; });
au.addEventListener('timeupdate', () => {
  $('prog').style.width = au.duration ? (au.currentTime / au.duration * 100) + '%' : '0';
});
$('bar').onclick = e => { if (au.duration) au.currentTime = e.offsetX / e.currentTarget.clientWidth * au.duration; };
$('play').onclick = () => {
  if (playing) { au.pause(); clearTimeout(gapTimer); playing = false; }
  else { $('hint').textContent = ''; if (!au.src) load(idx); au.playbackRate = speed; playing = true; au.play().catch(()=>{ playing=false; setIcon(); }); }
  setIcon();
};
const qStart = dir => {
  const qi = DATA.indexOf(turns[idx].q) + dir;
  const target = DATA[Math.max(0, Math.min(DATA.length - 1, qi))];
  return turns.findIndex(t => t.q === target);
};
$('prevQ').onclick = () => { const s = qStart(0); go(idx > s || au.currentTime > 3 ? s : qStart(-1), playing); };
$('nextQ').onclick = () => go(qStart(1), playing);
function paintOpts(){ $('speed').textContent = (Number.isInteger(speed) ? speed.toFixed(1) : String(speed)) + '×'; $('practice').classList.toggle('on', practice); }
$('speed').onclick = () => { speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length] || 1; au.playbackRate = speed; store.set('speed', speed); paintOpts(); };
$('practice').onclick = () => { practice = !practice; store.set('practice', practice); paintOpts();
  $('hint').textContent = practice ? '연습 모드: 면접관 질문 뒤에 멈춥니다.' : ''; };
document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); $('play').click(); } });
if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => { if (!playing) $('play').click(); });
  navigator.mediaSession.setActionHandler('pause', () => { if (playing) $('play').click(); });
  navigator.mediaSession.setActionHandler('previoustrack', () => $('prevQ').click());
  navigator.mediaSession.setActionHandler('nexttrack', () => $('nextQ').click());
}
$("qcount").textContent = `질문 ${DATA.length}개`;
paintOpts(); load(idx); au.pause();
</script>
</body>
</html>
