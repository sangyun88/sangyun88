<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>신한은행 슈퍼SOL PO 면접 시뮬레이션</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#f6f5f2; --surface:#fff; --text:#1d1d1f; --muted:#6e6e73; --line:#e6e4df;
  --her:#c2410c; --her-bg:#fff4ed; --me:#1d4ed8; --me-bg:#eef3ff; --accent:#1d1d1f;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121212; --surface:#1c1c1e; --text:#f2f2f2; --muted:#9a9aa0; --line:#2c2c2e;
    --her:#fb923c; --her-bg:#2a1d14; --me:#7aa2ff; --me-bg:#161f33; --accent:#f2f2f2; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 200px}
header h1{font-size:22px;margin:8px 0 4px;letter-spacing:-.02em}
header p{margin:0;color:var(--muted);font-size:14px}
.legend{display:flex;gap:14px;margin:14px 0 8px;font-size:13px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.q{margin:28px 0 0}
.q h2{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 10px;cursor:pointer;display:flex;gap:8px;align-items:center}
.q h2 .n{font-variant-numeric:tabular-nums;color:var(--text)}
.turn{border-radius:14px;padding:12px 14px;margin:8px 0;line-height:1.7;font-size:16px;cursor:pointer;
  border:1px solid transparent;transition:background .2s,border-color .2s;white-space:pre-line}
.turn .who{display:block;font-size:12px;font-weight:700;margin-bottom:2px}
.turn.interviewer .who{color:var(--her)}
.turn.me .who{color:var(--me)}
.turn.interviewer{margin-right:12%}
.turn.me{margin-left:6%}
.turn.active.interviewer{background:var(--her-bg);border-color:var(--her)}
.turn.active.me{background:var(--me-bg);border-color:var(--me)}
.turn:not(.active){opacity:.72}
.player{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.player .in{max-width:720px;margin:0 auto}
.now{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:8px}
.now b{color:var(--text)}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:10px;cursor:pointer}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.ctrls{display:flex;align-items:center;justify-content:space-between;gap:8px}
.btns{display:flex;align-items:center;gap:6px}
button{font:inherit;color:var(--text);background:none;border:0;cursor:pointer;border-radius:999px;padding:8px}
button:hover{background:var(--line)}
.play{width:52px;height:52px;background:var(--accent);color:var(--bg);display:grid;place-items:center}
.play:hover{background:var(--accent);opacity:.9}
.opts{display:flex;gap:6px;align-items:center;font-size:13px}
.chip{border:1px solid var(--line);padding:6px 10px;font-size:13px}
.chip.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
svg{display:block}
.hint{font-size:12px;color:var(--muted);margin-top:6px;min-height:1em}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p>🎧 듣기용 답변</p>
    <h1>신한은행 슈퍼SOL PO 면접 시뮬레이션</h1>
    <p><span id="qcount"></span> · 문장을 누르면 거기서부터 재생돼요</p>
    <div class="legend"><span><i class="dot" style="background:var(--her)"></i>면접관</span><span><i class="dot" style="background:var(--me)"></i>나</span></div>
  </header>
  <main id="list"></main>
</div>

<div class="player"><div class="in">
  <div class="now" id="now">재생을 눌러 시작하세요</div>
  <div class="bar" id="bar"><i id="prog"></i></div>
  <div class="ctrls">
    <div class="btns">
      <button id="prevQ" aria-label="이전 질문"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button class="play" id="play" aria-label="재생"><svg id="icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
      <button id="nextQ" aria-label="다음 질문"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
    </div>
    <div class="opts">
      <button class="chip" id="speed">1.0×</button>
      <button class="chip" id="practice" title="면접관 질문 뒤에 멈춰서 직접 답해볼 수 있어요">연습 모드</button>
    </div>
  </div>
  <div class="hint" id="hint"></div>
</div></div>

<audio id="au" preload="auto"></audio>
<script>
const DATA = [{"no": 1, "title": "자기소개", "turns": [{"speaker": "interviewer", "text": "간단히 자기소개 부탁드립니다.", "audio": "audio/interviewer_90c8d47545.mp3"}, {"speaker": "me", "text": "안녕하세요. 이상윤입니다. 현재 SK플래닛에서 UX기획 업무를 담당하고 있습니다.\n산업용 솔루션으로 시작해서, 시럽의 금 투자, 만보기 앱테크 오락, OK캐쉬백 쇼핑까지 리워드 기반 서비스를 설계해 왔고, 대부분의 프로젝트에서 UX PL로 이끌었습니다.\n화면을 만드는 데서 그치지 않고 지표로 결과를 확인하는 일에 재미를 느끼게 되었고, 그래서 서비스 전체를 책임지는 PO로 역할을 넓히고 싶어 지원했습니다.", "audio": "audio/me_ce0001a093.mp3"}]}, {"no": 2, "title": "지원 동기", "turns": [{"speaker": "interviewer", "text": "왜 슈퍼SOL PO에 지원하셨나요?", "audio": "audio/interviewer_ace359efef.mp3"}, {"speaker": "me", "text": "슈퍼SOL은 은행, 카드, 증권, 보험 서비스를 한 앱으로 합치는 큰 통합을 막 끝냈습니다. 이제는 그 통합이 고객에게 실제로 의미가 있었는지를 증명해야 하는 시점이라고 봤습니다.\n슈퍼SOL 안에는 포인트 미션, 밸런스게임, 결제 후 랜덤 포인트 같은 리워드와 게임 요소가 많습니다. 제가 해온 일이 바로 리워드로 들어온 사용자를 다시 오게 만들고, 실제 금융 행동까지 이어지게 설계하는 일이었습니다.\n그리고 지금 제 역할은 무엇을 만들지가 정해진 다음부터 시작합니다. 슈퍼SOL PO는 문제 정의부터 성과까지 책임지는 자리라서, 제가 다음으로 하고 싶은 일과 가장 맞닿아 있습니다.", "audio": "audio/me_b009a19b49.mp3"}]}, {"no": 3, "title": "현재 조직과 역할", "turns": [{"speaker": "interviewer", "text": "현재 조직은 어떻게 구성되어 있고, 그 안에서 어떤 역할을 하시나요?", "audio": "audio/interviewer_f9f29c6b2f.mp3"}, {"speaker": "me", "text": "플랫폼사업그룹 안에 Vertical UX팀에 소속되어 있고, UX팀은 UX기획과 GUI디자인 역할로 구분되어 있습니다.\n서비스 기획은 사업기획팀이 담당합니다. 사업기획팀은 무엇을, 왜 할지를 정합니다. 제휴사와 조건을 협의하고, 수익 구조와 상위 기획을 잡습니다.\nUX기획은 사업기획팀이 정한 방향을 어떻게 사용자가 실제로 쓰는 서비스로 풀어낼지 설계합니다. 상위 기획 단계부터 같이 아이데이션해서 방향을 잡고, Flow와 화면, 정책을 설계해서 UID를 작성하여 GUI와 개발, QA까지 넘깁니다.\n다만 경계가 칼같지는 않습니다. OK캐쉬백 쇼핑 프로젝트는 사업기획팀이 결정했지만, 누구를 타겟으로 어떤 컨셉으로 갈지는 UX에서 데이터를 보고 제안했습니다.", "audio": "audio/me_94bad1b59a.mp3"}, {"speaker": "interviewer", "text": "그럼 PO나 PM 역할은 안 해보신 거네요?", "audio": "audio/interviewer_07144ad0d9.mp3"}, {"speaker": "me", "text": "프로젝트 전체를 PM으로 끌고 간 경험은 없습니다. 대신 대부분의 프로젝트에서 UX PL을 맡았습니다. 그래서 PM이 어떤 일을 하는지 가까이서 봤고, 제가 도울 수 있는 일은 도왔습니다.\nPO로서 부족한 부분은 사업 구조를 보는 눈이라고 생각해서, 최근에는 쿠팡스탬프처럼 제휴 정산 구조와 리워드 단가부터 확인하고 기획하는 방식으로 일하는 순서를 바꾸고 있습니다.", "audio": "audio/me_299a77d30a.mp3"}]}, {"no": 4, "title": "직함과 기획 경력", "turns": [{"speaker": "interviewer", "text": "기획 경력이라고 쓰셨는데, 실제 직함은 디자이너 아닌가요?", "audio": "audio/interviewer_7ffe60a23b.mp3"}, {"speaker": "me", "text": "제 직무는 UX기획입니다.\n저희 UX팀은 UX기획과 GUI디자인이 직무로 나뉘어 있고, 저는 사업기획팀과 상위 기획부터 같이 잡고 상세 정책까지 직접 씁니다. 산출물 중에 UID가 있습니다. 화면마다 상태를 정의하고, 분기 조건과 예외 케이스, 에러 상황까지 개발자가 그대로 구현할 수 있는 수준으로 작성합니다. QA도 UID를 기준으로 검증합니다.", "audio": "audio/me_b02da08543.mp3"}, {"speaker": "interviewer", "text": "UX 출신인데, 사업 숫자까지 책임질 수 있나요?", "audio": "audio/interviewer_f57b9675eb.mp3"}, {"speaker": "me", "text": "커리어의 출발이 UX인 건 맞습니다. 다만 최근에는 사용성 지표를 넘어 사업 지표까지 보려고 의도적으로 범위를 넓혀왔습니다.\n야금야금에서는 제휴사 약관 동의와 투자 전환이라는 사업 지표를 알고 서비스를 설계했고, 1년 동안 약관 동의자가 54만 명 쌓였습니다. 최근 쿠팡스탬프에서는 제휴 정산 구조와 리워드 단가부터 확인하고 역제안했습니다.\n사업 경험이 완성됐다고 말씀드리기는 어렵습니다. 대신 제가 가진 사용자 관점에 사업 구조와 숫자를 더하면서, 서비스 전체를 책임지는 쪽으로 역할을 넓혀가고 있습니다.", "audio": "audio/me_886aa163d0.mp3"}]}, {"no": 5, "title": "고객 행동 변화를 이끈 사례", "turns": [{"speaker": "interviewer", "text": "과제로 제출하신 오락 리브랜딩을 처음부터 끝까지 설명해주세요.", "audio": "audio/interviewer_0a9e39b81e.mp3"}, {"speaker": "me", "text": "오락은 리브랜딩 전까지 MAU가 전년 대비 계속 줄어들던 만보기 앱테크 서비스였습니다. 신규 가입 전환율도 떨어지고 있었습니다.\n원인을 보려고 FGD를 했고, 잠금화면 앱테크를 쓰는 사람과 안 쓰는 사람, 두 그룹 8명을 만났습니다. 보상이 커서 들어오는 사람은 체리피커라서 신규를 넓히기 어려웠습니다. 반면 어차피 많이 걸으니 포인트도 받으면 이득이라는 사람들은 서비스 자체에서 쓸 이유를 찾았습니다. 그래서 보상 말고 참여 이유를 하나 더 만들자고 판단했습니다.\n가치소비 트렌드에서 미닝워크라는 컨셉을 가져와, 2024년 7월에 친환경 만보기로 리브랜딩했습니다. 이후 환경오염의 주범인 탄소를 탄소몬이라는 몬스터로 만들어, 친환경 미션을 하면 탄소몬을 무찌르는 탄소몬 잡기를 붙였고, 2025년 6월 2차 개편에서 홈 구조를 바꿔 이 참여형 기능을 앞으로 꺼냈습니다.\n결과적으로 최저점이던 2024년 6월 대비 2025년 7월에 MAU가 33%, 일평균 DAU가 14% 늘었습니다. 그리고 2025년 7월에는 탄소몬 잡기의 조회 수가 메인 기능인 오늘, 걸음을 넘어섰습니다. 보상만 받고 가던 사용자가 매일 참여하는 사용자로 바뀐 겁니다.", "audio": "audio/me_23b9ae5387.mp3"}, {"speaker": "interviewer", "text": "그 성과가 정말 리브랜딩 때문인가요? 원래 오르던 시기는 아니었나요?", "audio": "audio/interviewer_68affce8cd.mp3"}, {"speaker": "me", "text": "그래서 전년 같은 달과 비교했습니다. 리브랜딩 직전인 2024년 6월에는 MAU가 전년 대비 4% 줄고 있었는데, 2025년에는 증가로 돌아서서 7월에는 전년 대비 27% 늘었습니다. 계절 요인을 걷어내도 감소에서 성장으로 전환됐다는 뜻입니다.\n별도 마케팅은 없었습니다. 다만 같은 기간에 신규 기능 출시도 있었기 때문에 모든 성과를 리브랜딩 하나로 단정하지는 않고, 기여도가 컸다고 말씀드립니다.", "audio": "audio/me_4e969a82ff.mp3"}, {"speaker": "interviewer", "text": "배포 직후에는 지표가 어땠나요?", "audio": "audio/interviewer_edf0e397f3.mp3"}, {"speaker": "me", "text": "1차 배포 직후 두 달 정도는 DAU가 오히려 내려갔습니다. 관성적으로 쓰던 헤비 유저 일부와 4050 사용자가 1~2달 이탈했습니다. 오래 쓰면서 손에 익은 화면이 바뀌었으니까요.\n그런데 9월부터 회복해서 계속 올랐고, 신규 유입이 늘면서 새로운 4050 사용자도 함께 늘었습니다. 리브랜딩의 목표가 신규 유입이었기 때문에, 기존 사용자 일부가 빠지는 건 예상한 비용이었고 신규가 그 이상으로 들어오는지를 봤습니다.", "audio": "audio/me_2d59b42086.mp3"}, {"speaker": "interviewer", "text": "2차 개편에서는 무엇이 달라졌나요?", "audio": "audio/interviewer_d7927bf2e6.mp3"}, {"speaker": "me", "text": "2025년 6월 9일 배포 전후 11일 평균으로 보면, 탄소몬 잡기 DAU가 20.9%, 오늘 뉴스 DAU가 34% 늘었고, 친구 맺기는 183% 늘었습니다. 혼자 쓰던 앱이 관계형 행동으로 넓어진 겁니다.\n반면 메인 기능인 오늘, 걸음 DAU는 1.2%로 거의 그대로였습니다. 이미 포화된 메인 기능 대신, 참여형 기능에서 행동이 늘었다고 봤습니다.", "audio": "audio/me_18c97ba0dd.mp3"}]}, {"no": 6, "title": "성과 측정과 지표 관리", "turns": [{"speaker": "interviewer", "text": "성과는 어떤 기준으로 측정하고 관리하셨나요?", "audio": "audio/interviewer_d4c79c04a5.mp3"}, {"speaker": "me", "text": "세 층으로 봤습니다. 규모, 구성, 행동입니다.\n규모는 MAU와 일평균 DAU입니다. 다만 MAU는 이벤트 같은 일회성 유입에 크게 흔들려서, DAU를 같이 보고 전년 같은 달과 비교해 계절 요인을 걷어냈습니다.\n구성은 신규 유입의 연령대입니다. 리브랜딩의 목표가 2030 신규 유입이었기 때문입니다.\n행동은 와서 무엇을 했는지입니다. 탄소몬 잡기, 친구 맺기처럼 참여형 기능의 DAU와 조회 수를 봤습니다.\n솔직히 아쉬웠던 건 신규 재방문율입니다. 유입은 늘었지만 재방문율 유지는 숙제였고, 그래서 2차 개편에서 홈과 하단 탭 구조를 바꿔 참여형 기능을 앞으로 꺼냈습니다.", "audio": "audio/me_2c08b8284b.mp3"}, {"speaker": "interviewer", "text": "최근 지표는 어떤가요?", "audio": "audio/interviewer_a3ad4a3d5f.mp3"}, {"speaker": "me", "text": "2025년 9월 기준으로도 최저점 대비 MAU는 20%, DAU는 10% 높습니다. 7월 피크에는 계절 요인이 섞여 있어서 조금 내려왔지만, 탄소몬 잡기가 메인 기능보다 더 많이 조회되는 흐름은 3개월 연속 유지되고 있습니다.", "audio": "audio/me_46c5fcad7e.mp3"}]}, {"no": 7, "title": "팀 리딩", "turns": [{"speaker": "interviewer", "text": "그 프로젝트에서 팀은 어떻게 이끄셨나요?", "audio": "audio/interviewer_57457e7d02.mp3"}, {"speaker": "me", "text": "오락은 기획 3명, UX기획 2명, GUI 2명, 개발 12명, 19명 규모 프로젝트였고, 2024년 3월부터 2025년 6월까지 진행했습니다. 저는 UX PL을 맡았습니다.\n개발 인원이 가장 많았기 때문에, 직군마다 우선순위가 달라지지 않도록 2030 신규 유입이라는 한 목표에 맞춰 설명하려고 했습니다. 같은 목표를 각 직군의 말로 풀어서 전달했습니다.\n의견이 갈릴 때는 누가 맞는지보다 무엇을 보면 판단할 수 있는지를 먼저 정했습니다. 기준이 있으면 감정 싸움 없이 결과를 보고 이야기할 수 있습니다.", "audio": "audio/me_fd6986e9b3.mp3"}]}, {"no": 8, "title": "쇼핑탭에서 한 일", "turns": [{"speaker": "interviewer", "text": "OK캐쉬백 쇼핑탭에서 본인이 한 일은 무엇인가요?", "audio": "audio/interviewer_63c7ed704d.mp3"}, {"speaker": "me", "text": "쇼핑 기능이 여러 탭에 흩어져 있어서, 상품이 한 눈에 보이지 않고 구매 흐름이 단절되는 구조였습니다. 등급별로 보니 포인트는 쌓이는데 쓸 곳을 모르는 M/L 고객이 가장 반응할 가능성이 컸습니다. 그래서 목적 없이 들어와도 피드에서 상품을 발견하고, 포인트가 할인처럼 느껴지게 결제하는 발견형 쇼핑을 컨셉으로 잡았습니다.\n4월 오픈 이후 9월까지 일평균 DAU가 4.6만에서 9.8만으로 약 2.1배, MAU가 28.7만에서 51.6만으로 80% 늘었습니다. 휴면이었다가 돌아온 사용자도 MAU의 7.7%에서 15.8%로 두 배가 됐습니다.", "audio": "audio/me_0f8fed5bda.mp3"}, {"speaker": "interviewer", "text": "오픈 초기니까 당연히 늘어난 것 아닌가요?", "audio": "audio/interviewer_4f8967971e.mp3"}, {"speaker": "me", "text": "그런 영향도 있습니다. 그래서 휴면 복귀는 인원이 아니라 MAU 대비 비중으로 말씀드렸습니다. 오픈 이후 시간이 지나면 돌아올 수 있는 사람 자체가 늘어나기 때문입니다.\n그리고 방문 지표는 서비스 성장으로만 말씀드리고, 제가 직접 개선한 효과는 구매전환율로 따로 봤습니다.", "audio": "audio/me_b34dc870eb.mp3"}]}, {"no": 9, "title": "데이터로 찾은 개선", "turns": [{"speaker": "interviewer", "text": "데이터로 문제를 찾아서 서비스를 개선한 경험이 있나요?", "audio": "audio/interviewer_54b5e9d741.mp3"}, {"speaker": "me", "text": "OK캐쉬백 쇼핑의 결제 화면 개선입니다.\n퍼널을 분석해보니 마지막 단계인 결제 화면에서 이탈이 가장 컸습니다. 커머스에서 결제 단계 이탈이 큰 건 흔한 일입니다. 그런데 저희는 장바구니가 없었습니다. 담아두고 나중에 다시 올 방법이 없으니, 결제 화면에서 최대한 결제까지 끝나게 만들어야 했습니다.\n화면을 보니 사용자가 최종으로 얼마를 내는지 한눈에 알기 어려웠습니다. 원가와 실제 결제금액이 구분되지 않았고, 포인트를 얼마나 쓸 수 있는지도 바로 보이지 않았습니다. 금액이 불확실하면 사용자는 결제를 멈춘다고 판단했습니다.\n그래서 원가와 총 결제금액을 나눠 보여주고, 포인트 사용 화면을 고쳤습니다. 포인트가 모자라면 나머지를 카드로 결제할 수 있다는 안내도 붙였습니다.\n5월 말 개선 이후 구매전환율은 개선 전 4~5월 평균 4.62%에서 7~8월 평균 7.29%로, 2.67%p 올랐습니다. 포인트와 카드를 같이 쓰는 복합결제 비중도 3%p 늘었습니다.", "audio": "audio/me_5cd97420b2.mp3"}, {"speaker": "interviewer", "text": "그 이후에도 유지됐나요?", "audio": "audio/interviewer_deb8c4b6cb.mp3"}, {"speaker": "me", "text": "솔직히 말씀드리면 개선 직후 6월은 3.99%로 오히려 낮았고, 9월에는 4.87%로 개선 전 수준 가까이 내려왔습니다. 그래서 지속적인 상승이라고는 말씀드리지 않습니다.\n개선 직후 적응 구간을 지나 7~8월에 크게 올랐고, 이후 안정화된 흐름입니다. 6월부터 9월 전체 평균으로 보면 5.86%로, 개선 전보다 1.24%p 높습니다. 9월 하락에 이벤트 종료 같은 다른 요인이 있었는지는 계속 확인하고 있습니다.", "audio": "audio/me_7a6227c7f7.mp3"}]}, {"no": 10, "title": "AI 활용", "turns": [{"speaker": "interviewer", "text": "업무에 AI를 어떻게 활용하고 계신가요?", "audio": "audio/interviewer_0c44676e30.mp3"}, {"speaker": "me", "text": "공동구매 예측 툴을 직접 만들었습니다. 운영 담당자가 실적 엑셀을 올리면, 툴이 그 파일을 참조해서 최신 사례까지 반영해 판단합니다. LLM 노코드 툴에 OpenAI API로 GPT를 연결해서 만들었고, Cowork에 1주일 주기로 스케줄을 걸어서 자동 업데이트되게 연결했습니다.\n모델을 학습시킨 건 아니고, 과거 실적을 참조하게 만든 판단 보조 도구입니다. 담당자 경험에만 의존하던 판단에 근거를 하나 더 얹는 게 목적이었습니다. 개발 리소스를 요청할 만큼 큰 일이 아니어서 직접 만들었습니다.\n이 밖에도 리서치를 정리하거나, 아이디어를 빠르게 프로토타입으로 만들어 확인할 때 AI를 씁니다. 슈퍼SOL도 AI 에이전트를 앞세우고 있어서, PO가 직접 빠르게 만들어보고 검증하는 방식이 도움이 될 거라고 생각합니다.", "audio": "audio/me_b028eae38d.mp3"}]}, {"no": 11, "title": "가설이 틀렸던 경험", "turns": [{"speaker": "interviewer", "text": "가설이 틀렸던 경험이 있나요?", "audio": "audio/interviewer_ff3cb34d51.mp3"}, {"speaker": "me", "text": "야금야금 UT 때입니다. 6명을 만났습니다. 투자에 관심 있는 신규 사용자 4명, 야금야금을 가볍게 쓰던 사용자 2명입니다. 명품 조각이나 가상자산 같은 제휴 상품이 붙으면서 설계가 바뀌어서, 가설 다섯 개를 세우고 들어갔습니다.\n정보가 부족할 거라는 가설은 반만 맞았습니다. 투자에 익숙한 사람은 판단할 정보가 모자라다고 했습니다. 그런데 경험이 적은 사람은 그 전 단계에서 막혔습니다. 명품 조각, 오픈런 같은 용어부터 어려워했고, 판단할 때는 다른 사용자들의 반응을 찾았습니다.\n둘 다 만족시키려고 하지는 않았습니다. 시럽은 포인트로 가볍게 투자를 시작하는 비전문가가 핵심 고객이라고 판단했습니다. 그래서 정보를 무작정 늘리는 대신, 개념은 꼭 필요한 것만 쉽게 풀고 시세는 분석된 결과로 보여주도록 단순화했습니다.", "audio": "audio/me_f8050fa577.mp3"}]}, {"no": 12, "title": "리워드에서 금융 습관으로", "turns": [{"speaker": "interviewer", "text": "리워드로 들어온 사용자를 실제 금융 이용으로 어떻게 이어갈 수 있을까요?", "audio": "audio/interviewer_f7fb8e7d55.mp3"}, {"speaker": "me", "text": "야금야금에서 비슷한 문제를 풀었습니다. 제휴사와 함께 만든 금 투자 서비스라서, 투자 경험이 없는 사용자도 실제 투자까지 가게 만드는 걸 목표로 잡았습니다.\n그래서 출석체크를 하면 자동으로 금 투자가 되게 했습니다. 포인트로 첫 투자를 부담 없이 경험하게 하고, 시세를 보고 추가로 투자할 수 있게 했습니다. 1년 누적으로 제휴사 약관 동의자가 54만 명, 포인트로 한 금 투자가 126만 건이었습니다.\n핵심은 리워드를 받는 행동 안에 금융의 첫 경험을 자연스럽게 넣는 것이라고 봅니다. 슈퍼SOL에서 포인트 미션을 하는 사용자가 은행 계좌에서 바로 주식을 사는 SOL LINK 같은 경험으로 한 걸음 넘어가게 만드는 것도 같은 문제라고 생각합니다.", "audio": "audio/me_8a5bfb0188.mp3"}]}, {"no": 13, "title": "포인트 vs 현금 서비스", "turns": [{"speaker": "interviewer", "text": "포인트 기반 서비스와 현금 기반 서비스, 기획할 때 뭐가 다른가요?", "audio": "audio/interviewer_a6f3aa2f67.mp3"}, {"speaker": "me", "text": "포인트는 심리적 장벽이 낮습니다. 공짜로 얻은 돈이라는 감각이 있어서 첫 시도가 쉽습니다. 대신 쉽게 쓰는 만큼 쉽게 떠납니다. 그래서 포인트 서비스는 재방문 설계가 핵심이었습니다.\n현금은 반대입니다. 첫 진입이 어렵고, 대신 한 번 시작하면 오래 갑니다. 그래서 초기 신뢰 설계가 더 중요하다고 봅니다. 금액이 어떻게 계산되는지, 지금 내 돈이 어떤 상태인지가 매 단계 보여야 합니다.\n제가 해온 건 포인트 쪽이지만, 사용자가 멈추는 지점은 비슷했습니다. 금액이 불확실할 때였습니다. 결제 화면 개선도 같은 이유에서 출발했습니다.", "audio": "audio/me_6223a5ef7d.mp3"}]}, {"no": 14, "title": "슈퍼SOL에서 풀고 싶은 문제", "turns": [{"speaker": "interviewer", "text": "슈퍼SOL을 써보셨을 텐데, 어떤 문제를 풀어보고 싶으신가요?", "audio": "audio/interviewer_8ef58eba57.mp3"}, {"speaker": "me", "text": "밖에서 본 거라 틀릴 수도 있습니다.\n통합 이후 MAU는 늘었고, SOL LINK 계좌도 빠르게 개설됐습니다. 이제는 그 사용자가 계열사 서비스를 넘나들며 다시 오는지가 다음 숙제라고 봅니다.\n슈퍼SOL에는 포인트 미션과 밸런스게임처럼 매일 들어올 이유가 이미 있습니다. 다만 미션을 하고 포인트만 받고 나가면, 은행 앱을 볼일 있을 때만 여는 습관은 그대로입니다.\n그래서 미션과 금융 행동을 잇는 쪽을 보고 싶습니다. 오락에서 보상만으로는 사람이 머물지 않았고, 매일 참여할 이유를 붙였을 때 참여형 기능이 메인 기능을 넘어섰습니다. 확인한다면 미션 참여자가 다음 달에 계좌, 카드, 투자 같은 금융 행동으로 넘어가는 비율부터 보겠습니다.", "audio": "audio/me_7ffea4a8d9.mp3"}]}, {"no": 15, "title": "금융 앱에 생활 서비스가 필요한 이유", "turns": [{"speaker": "interviewer", "text": "금융 앱에 비금융 생활 서비스가 들어가는 게 왜 필요하다고 보시나요?", "audio": "audio/interviewer_08816dcbe4.mp3"}, {"speaker": "me", "text": "은행 앱은 볼일이 있을 때만 엽니다. 이체하고 잔액 보고 닫습니다. 그래서 오늘 이 앱을 열 이유가 필요하다고 봅니다.\n비금융 서비스가 그 이유를 만듭니다. 다만 아무거나 붙이면 안 됩니다. 기준은 돈의 흐름과 이어지는지입니다. 쇼핑은 결제와 포인트로, 걷기 같은 생활 미션은 리워드로 이어집니다. 그래야 금융 앱에서 쓸 이유가 생깁니다.", "audio": "audio/me_d803e3011f.mp3"}]}, {"no": 16, "title": "계열사와 제휴가 얽힌 구조에서 PO의 역할", "turns": [{"speaker": "interviewer", "text": "슈퍼SOL은 은행, 카드, 증권, 보험이 한 앱에 있습니다. 그 구조에서 PO의 역할은 뭘까요?", "audio": "audio/interviewer_2c48e82f44.mp3"}, {"speaker": "me", "text": "번역과 이음새라고 생각합니다.\n각 회사의 상품 구조를 그대로 가져오면 계열사 앱 여러 개를 한 화면에 모은 것에 그칩니다. 사용자는 이미 아는 방식으로 새 상품을 쓸 수 있어야 합니다. 그래서 각 회사의 상품을 슈퍼SOL의 문법으로 번역하는 게 PO 몫이라고 봅니다.\n그리고 이음새를 책임져야 합니다. 여러 회사가 얽힌 서비스는 경계에서 문제가 생깁니다. 어디까지가 어느 회사 책임인지 사용자는 모르니까요.\nOK캐쉬백 쇼핑도 제휴사 상품을 앱 안에 들이는 구조였고, 쿠팡스탬프에서는 제휴 정산 구조부터 확인하고 설계했습니다.", "audio": "audio/me_df7eb2d940.mp3"}, {"speaker": "interviewer", "text": "계열사 간 이해관계나 준법 심의 때문에 일정이 늦어지면 어떻게 하시겠어요?", "audio": "audio/interviewer_8921371af3.mp3"}, {"speaker": "me", "text": "먼저 무엇을 보면 판단할 수 있는지, 기준부터 같이 정하겠습니다. 계열사마다 보는 지표가 다르니, 공통으로 확인할 고객 지표를 먼저 합의하면 이해관계가 숫자로 정리됩니다.\n심의처럼 정해진 절차는 피할 수 없으니, 그 일정을 역산해서 기획 순서를 잡겠습니다. 그리고 한 번에 크게 가기보다 작게 먼저 해보고 반응을 확인하는 방식으로, 다음 단계를 설득할 근거를 만들겠습니다.", "audio": "audio/me_21e493b846.mp3"}]}, {"no": 17, "title": "아이디어 판단 기준", "turns": [{"speaker": "interviewer", "text": "아이디어 단계에서 된다 안 된다를 무엇으로 판단하시나요?", "audio": "audio/interviewer_aa89d2d295.mp3"}, {"speaker": "me", "text": "이미 그 행동을 하고 있는 사람이 있느냐를 봅니다. 다른 데서라도요. 없는 행동을 새로 만드는 건 어렵지만, 이미 하는 걸 편하게 만드는 건 됩니다. 오락도 걷기라는 원래 하던 행동에 의미를 붙인 것이었습니다.\n그 다음은 수익 구조입니다. 줄 수 있는 것의 크기가 정해져 있으면 기획 범위도 거기서 정해집니다. 단가를 모르고 설계하면 나중에 다 뒤집힙니다.\n마지막으로 그 시장에서 슈퍼SOL만 가질 수 있는 게 있는지를 봅니다. 은행, 카드, 증권, 보험이 한 앱에 있다는 것 자체가 다른 앱이 갖기 어려운 강점입니다.", "audio": "audio/me_6b1c4ffb0c.mp3"}]}, {"no": 18, "title": "데이터가 없을 때의 문제 정의", "turns": [{"speaker": "interviewer", "text": "새 서비스는 데이터가 없는 상태에서 시작합니다. 그럴 때 어떻게 문제를 정의하시나요?", "audio": "audio/interviewer_0d95929c8d.mp3"}, {"speaker": "me", "text": "우리 데이터가 없을 뿐이지, 비슷한 행동의 데이터는 어딘가에 있다고 봅니다. 같은 시장의 기존 서비스, 공개된 시장 자료, 유사 상품의 이용 패턴이요.\n그 다음은 사람에게 직접 확인합니다. 오락은 FGD로 사용자 유형부터 다시 잡았고, 야금야금은 UT로 가설을 확인했습니다. 숫자가 없으면 사람에게 물어보는 게 맞다고 봅니다.", "audio": "audio/me_d3a3fc549f.mp3"}]}, {"no": 19, "title": "SQL 직접 vs 요청", "turns": [{"speaker": "interviewer", "text": "데이터를 직접 뽑는 일과 데이터 조직에 요청하는 일의 기준이 뭔가요?", "audio": "audio/interviewer_aeb5eb3037.mp3"}, {"speaker": "me", "text": "요즘은 LLM 덕분에 대부분의 SQL은 직접 짜서 봅니다. 매출이나 개인정보와 연관된 데이터는 데이터 조직에 요청합니다. 권한이 없는 데이터를 무리하게 보려고 하기보다, 볼 수 있는 집계 데이터로 비율과 추세를 먼저 확인하는 편입니다.", "audio": "audio/me_2a24d36269.mp3"}]}, {"no": 20, "title": "정량과 정성의 충돌", "turns": [{"speaker": "interviewer", "text": "정량과 정성이 서로 다른 답을 가리켰던 적이 있나요?", "audio": "audio/interviewer_fa02a2c821.mp3"}, {"speaker": "me", "text": "숫자는 어디서 문제가 생기는지를 알려주고, 인터뷰는 왜 그런지를 알려준다고 봅니다. 둘이 어긋나면 대개 숫자를 잘못 읽었거나, 인터뷰 대상이 그 숫자를 만든 사람이 아닌 경우입니다. 그래서 두 데이터가 같은 사용자 집단을 보고 있는지부터 확인합니다.", "audio": "audio/me_64e7c3e9bb.mp3"}]}, {"no": 21, "title": "의견이 받아들여지지 않을 때", "turns": [{"speaker": "interviewer", "text": "본인 의견이 받아들여지지 않았을 때는 어떻게 하시나요?", "audio": "audio/interviewer_4b27414dc7.mp3"}, {"speaker": "me", "text": "먼저 수용적으로 받아들입니다. 다른 의견에도 나름의 이유가 있다고 생각하니까요.\n다만 그대로 넘어가지는 않고, 데이터나 직접 경험해볼 수 있는 다른 기준으로 판단해보려고 합니다. 지표를 같이 보거나, 작게 먼저 해보고 반응을 확인하는 식입니다. 기준이 있으면 감정 싸움 없이 결과를 보고 이야기할 수 있습니다.", "audio": "audio/me_add0a27348.mp3"}]}, {"no": 22, "title": "이직 사유", "turns": [{"speaker": "interviewer", "text": "왜 지금 이직을 결심하셨나요?", "audio": "audio/interviewer_13e789b142.mp3"}, {"speaker": "me", "text": "지금 회사에 불만이 있어서는 아닙니다. 쇼핑 영역을 맡아 지표도 나오고 있고, 일하는 환경도 괜찮습니다.\n다만 제가 맡는 범위가 정해져 있습니다. 어떤 제휴사와 어떤 상품을 붙일지는 사업팀이 정하고, 저는 그게 정해진 다음부터 들어갑니다. 어떻게 만들지는 제가 정하는데, 만들지 말지는 제 몫이 아닙니다.\n결제 화면 개선을 하면서 그 선이 더 뚜렷하게 보였습니다. 지표를 보고 문제를 찾아 고쳤더니 전환율이 올랐는데, 그 경험이 재미있었습니다. 그러면서 이걸 화면 단위가 아니라 서비스 단위로 하면 어떨까 하는 생각이 들었습니다.\nPO는 문제를 정의하는 단계부터 출시하고 지표로 고치는 단계까지 책임지는 역할입니다. 제가 다음으로 하고 싶은 일이 그겁니다.", "audio": "audio/me_16802ffced.mp3"}, {"speaker": "interviewer", "text": "지금 회사에서 그 역할로 옮길 수는 없나요?", "audio": "audio/interviewer_644db9ff0c.mp3"}, {"speaker": "me", "text": "조직 구조상 기획 직무는 별도 조직에 있습니다. 옮기려면 직군 자체를 바꿔야 하는데, 그렇게 되면 지금까지 쌓은 설계 역량을 살리기 어려운 구조였습니다.", "audio": "audio/me_73e4370020.mp3"}]}, {"no": 23, "title": "5년 뒤", "turns": [{"speaker": "interviewer", "text": "5년 뒤 어떤 사람이 되어 있고 싶으신가요?", "audio": "audio/interviewer_2d90c0f7cf.mp3"}, {"speaker": "me", "text": "서비스 하나를 처음부터 끝까지 책임져본 사람이 되어 있고 싶습니다. 지금은 기능 단위까지입니다.\n그리고 고객의 하루에 남는 서비스를 만들고 싶습니다. 볼일이 있을 때만이 아니라, 열 이유가 있는 앱이요.", "audio": "audio/me_d236499c11.mp3"}]}, {"no": 24, "title": "마지막 역질문", "turns": [{"speaker": "interviewer", "text": "마지막으로 궁금하신 점 있으신가요?", "audio": "audio/interviewer_e109e08d98.mp3"}, {"speaker": "me", "text": "슈퍼SOL에서 PO에게 가장 기대하시는 역할은 무엇인가요?\n통합 이후 팀이 가장 중요하게 보고 있는 지표는 무엇인가요?", "audio": "audio/me_3da515fa32.mp3"}]}, {"no": 25, "title": "영상면접: 상황 질문", "turns": [{"speaker": "interviewer", "text": "친한 친구 2명과 여행을 갔습니다. 한 친구는 계획적으로 움직이자고 하고, 한 친구는 무계획으로 움직이자고 합니다. 어떻게 하시겠습니까?", "audio": "audio/interviewer_c0b9da3580.mp3"}, {"speaker": "me", "text": "먼저 두 친구에게 이번 여행에서 가장 하고 싶은 것을 물어보겠습니다. 계획파 친구는 놓치고 싶지 않은 것이 있고, 무계획파 친구는 여유롭게 즐기고 싶은 것일 가능성이 높기 때문입니다.\n그래서 꼭 가고 싶은 곳 한두 곳과 이동처럼 꼭 정해야 하는 것만 미리 정하고, 나머지 시간은 자유롭게 비워 두자고 제안하겠습니다. 두 친구 모두 원하는 것을 지킬 수 있고, 여행이 끝난 뒤에도 서로 만족할 수 있다고 생각합니다.", "audio": "audio/me_cd82456422.mp3"}]}, {"no": 26, "title": "영상면접: 장단점", "turns": [{"speaker": "interviewer", "text": "자신의 장단점은 무엇입니까?", "audio": "audio/interviewer_1b03d17d95.mp3"}, {"speaker": "me", "text": "제 장점은 결과를 숫자로 확인하는 습관입니다. 프로젝트를 시작할 때 어떤 지표로 판단할지 먼저 정하고, 끝난 뒤에 돌아보며 다음 개선을 정합니다.\n단점은 데이터를 충분히 확인하기 전에는 결론을 내리지 않으려다 결정이 늦어질 때가 있다는 점입니다. 그래서 요즘은 완벽한 데이터를 기다리기보다 먼저 가설을 세우고 빠르게 검증하는 방식으로 보완하고 있습니다.", "audio": "audio/me_f71468fe56.mp3"}]}, {"no": 27, "title": "영상면접: 강점과 약점", "turns": [{"speaker": "interviewer", "text": "자신의 강점과 약점이 무엇이라고 생각하시나요? 이유를 들어 말씀해주세요.", "audio": "audio/interviewer_4dde237d9c.mp3"}, {"speaker": "me", "text": "제 강점은 서로 다른 직군의 말을 이어 주는 것입니다. 오락 리브랜딩은 기획, 디자인, 개발 19명 규모의 프로젝트였는데, UX PL로서 같은 목표를 각 직군의 언어로 풀어서 전달하려고 노력했습니다.\n약점은 일을 직접 해결하려는 경향이 있어서 맡기는 데 서툴 수 있다는 점입니다. 그래서 최근에는 역할을 먼저 나누고 중간에 점검하는 방식으로 바꾸고 있습니다.", "audio": "audio/me_8500678d98.mp3"}]}];
const lab = q => q.no ? `Q${q.no}` : '역질문';
const turns = [];
DATA.forEach(q => q.turns.forEach(t => turns.push({...t, q})));

const $ = id => document.getElementById(id);
const au = $('au'), list = $('list');
const SPEEDS = [0.8, 0.9, 1.0, 1.1, 1.25, 1.5];
const store = { get(k, d){ try{ const v = localStorage.getItem('iv_'+location.pathname+k); return v===null?d:JSON.parse(v) }catch(e){ return d } },
                set(k, v){ try{ localStorage.setItem('iv_'+location.pathname+k, JSON.stringify(v)) }catch(e){} } };
let idx = Math.min(store.get('idx', 0), turns.length - 1);
let speed = store.get('speed', 1.0), practice = store.get('practice', false);
let playing = false, gapTimer = null;

// 렌더
turns.forEach((t, i) => {
  if (!t.q._el) {
    const sec = document.createElement('section'); sec.className = 'q';
    sec.innerHTML = `<h2><span class="n">${lab(t.q)}</span>${t.q.title}</h2>`;
    sec.querySelector('h2').onclick = () => go(i, true);
    list.appendChild(sec); t.q._el = sec;
  }
  const d = document.createElement('div');
  d.className = 'turn ' + t.speaker;
  d.innerHTML = `<span class="who">${t.speaker === 'interviewer' ? '면접관' : '나'}</span>`;
  d.appendChild(document.createTextNode(t.text));
  d.onclick = () => go(i, true);
  t.el = d; t.q._el.appendChild(d);
});

function mark(scroll){
  turns.forEach((t, i) => t.el.classList.toggle('active', i === idx));
  const t = turns[idx];
  $('now').innerHTML = `<b>${lab(t.q)}</b> · ${t.q.title} · ${t.speaker === 'interviewer' ? '면접관' : '나'}`;
  if (scroll) t.el.scrollIntoView({behavior:'smooth', block:'center'});
  store.set('idx', idx);
  if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({
    title: `${lab(t.q)}. ${t.q.title}`, artist: t.speaker === 'interviewer' ? '면접관' : '나', album: '면접 시뮬레이션'});
}
function setIcon(){
  $('icon').innerHTML = playing ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
  $('play').setAttribute('aria-label', playing ? '일시정지' : '재생');
}
function load(i){ idx = i; au.src = turns[i].audio; au.playbackRate = speed; mark(true); }
function go(i, play){
  clearTimeout(gapTimer); $('hint').textContent = '';
  if (i < 0 || i >= turns.length) { playing = false; setIcon(); return; }
  load(i); if (play) { playing = true; au.play().catch(()=>{ playing=false; setIcon(); }); } setIcon();
}
au.addEventListener('ended', () => {
  const cur = turns[idx], nxt = turns[idx + 1];
  if (!nxt) { playing = false; setIcon(); $('hint').textContent = '끝까지 들으셨어요 👏'; return; }
  if (practice && cur.speaker === 'interviewer' && nxt.speaker === 'me') {
    load(idx + 1); playing = false; setIcon();
    $('hint').textContent = '직접 답해보세요. 준비되면 ▶︎를 눌러 모범 답변을 들어요.'; return;
  }
  // 화자 전환·질문 전환 사이에 자연스러운 쉼
  const pause = nxt.q !== cur.q ? 1400 : 650;
  gapTimer = setTimeout(() => go(idx + 1, true), pause / speed);
});
au.addEventListener('error', () => { playing = false; setIcon(); $('hint').textContent = '오디오를 불러오지 못했어요.'; });
au.addEventListener('timeupdate', () => {
  $('prog').style.width = au.duration ? (au.currentTime / au.duration * 100) + '%' : '0';
});
$('bar').onclick = e => { if (au.duration) au.currentTime = e.offsetX / e.currentTarget.clientWidth * au.duration; };
$('play').onclick = () => {
  if (playing) { au.pause(); clearTimeout(gapTimer); playing = false; }
  else { $('hint').textContent = ''; if (!au.src) load(idx); au.playbackRate = speed; playing = true; au.play().catch(()=>{ playing=false; setIcon(); }); }
  setIcon();
};
const qStart = dir => {
  const qi = DATA.indexOf(turns[idx].q) + dir;
  const target = DATA[Math.max(0, Math.min(DATA.length - 1, qi))];
  return turns.findIndex(t => t.q === target);
};
$('prevQ').onclick = () => { const s = qStart(0); go(idx > s || au.currentTime > 3 ? s : qStart(-1), playing); };
$('nextQ').onclick = () => go(qStart(1), playing);
function paintOpts(){ $('speed').textContent = (Number.isInteger(speed) ? speed.toFixed(1) : String(speed)) + '×'; $('practice').classList.toggle('on', practice); }
$('speed').onclick = () => { speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length] || 1; au.playbackRate = speed; store.set('speed', speed); paintOpts(); };
$('practice').onclick = () => { practice = !practice; store.set('practice', practice); paintOpts();
  $('hint').textContent = practice ? '연습 모드: 면접관 질문 뒤에 멈춥니다.' : ''; };
document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); $('play').click(); } });
if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => { if (!playing) $('play').click(); });
  navigator.mediaSession.setActionHandler('pause', () => { if (playing) $('play').click(); });
  navigator.mediaSession.setActionHandler('previoustrack', () => $('prevQ').click());
  navigator.mediaSession.setActionHandler('nexttrack', () => $('nextQ').click());
}
$("qcount").textContent = `질문 ${DATA.filter(q => q.no).length}개`;
paintOpts(); load(idx); au.pause();
</script>
</body>
</html>
