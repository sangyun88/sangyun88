<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lee Sangyun — Product Designer Portfolio</title>
    <meta name="description" content="Lee Sangyun — Product Designer. Selected work, 2015 — Present.">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <!--
      Hover-expand gallery adapted from:
      Skiper 52 — HoverExpand_001 (React + Framer Motion)
      Author: @gurvinder-singh02 · https://gxuri.me · https://x.com/Gur__vi

      License & Usage:
      - Free to use and modify in both personal and commercial projects.
      - Attribution to Skiper UI is required when using the free version.
      - No attribution required with Skiper UI Pro.

      Ported to vanilla HTML/CSS/JS (CSS transitions in place of Framer Motion).
    -->

    <script>document.documentElement.classList.add('js');</script>

    <style>
        :root {
            --bg: #f5f4f3;
            --ink: #111111;
            --muted: #6b7280;
            --ease: cubic-bezier(0.42, 0, 0.58, 1);
            --dur: 0.3s;
            --gap: 0.25rem;

            --w-init: 2.5rem;
            --h-init: 15rem;
            --w-idle: 5rem;
            --h-idle: 19rem;
            --w-active: 24rem;
            --h-active: 24rem;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--ink);
            font-family: 'Inter', 'Pretendard', ui-sans-serif, system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .stage {
            position: relative;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
        }

        /* ---------- Bars ---------- */

        .bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
            flex: none;
            padding: 1.75rem 2rem;
            font-size: 0.8125rem;
            font-weight: 500;
            letter-spacing: -0.01em;
            color: var(--muted);
        }

        /* The intro only exists when scripting does. Without it the page is
           already in its resting state rather than stuck at opacity 0. */
        .js .stage:not(.ready) header.bar {
            opacity: 0;
            transform: translateY(-8px);
        }

        .js .stage:not(.ready) footer.bar {
            opacity: 0;
            transform: translateY(8px);
        }

        /* Nothing sits on the left any more, so keep the links on the right
           instead of letting space-between pull them across. */
        footer.bar {
            justify-content: flex-end;
        }

        .stage.ready .bar {
            transition: opacity 0.7s var(--ease), transform 0.7s var(--ease);
        }

        header.bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1;
        }

        .bar strong {
            color: var(--ink);
            font-weight: 500;
        }

        .links {
            display: flex;
            gap: 1.5rem;
        }

        .credit {
            color: var(--muted);
            opacity: 0.7;
        }

        .links a {
            color: var(--muted);
            text-decoration: none;
            transition: color 0.2s var(--ease);
        }

        .links a:hover,
        .links a:focus-visible {
            color: var(--ink);
        }

        /* ---------- Gallery ---------- */

        .gallery-wrap {
            flex: 1 1 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5rem 1.25rem;
        }

        .gallery {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--gap);
            width: 100%;
            max-width: 72rem;
        }

        .js .stage:not(.ready) .gallery {
            opacity: 0;
            transform: translateY(20px);
        }

        .stage.ready .gallery {
            transition: opacity var(--dur) var(--ease) 0.5s, transform var(--dur) var(--ease) 0.5s;
        }

        .card {
            position: relative;
            display: block;
            flex: none;
            width: var(--w-idle);
            height: var(--h-idle);
            border-radius: 1.5rem;
            overflow: hidden;
            background-color: #e7e5e4;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            -webkit-tap-highlight-color: transparent;
        }

        .card.is-active {
            width: var(--w-active);
            height: var(--h-active);
        }

        .js .stage:not(.ready) .card,
        .js .stage:not(.ready) .card.is-active {
            width: var(--w-init);
            height: var(--h-init);
        }

        .stage.ready .card {
            transition: width var(--dur) var(--ease), height var(--dur) var(--ease);
        }

        .card:focus-visible {
            outline: 2px solid var(--ink);
            outline-offset: 3px;
        }

        .card img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            transition: transform 0.6s var(--ease);
        }

        .card.is-active:hover img {
            transform: scale(1.04);
        }

        .scrim {
            position: absolute;
            inset: 0;
            background-image: linear-gradient(to top,
                    rgba(0, 0, 0, 0.80) 0%,
                    rgba(0, 0, 0, 0.55) 18%,
                    rgba(0, 0, 0, 0.18) 42%,
                    rgba(0, 0, 0, 0) 68%);
            opacity: 0;
            transition: opacity var(--dur) var(--ease);
            pointer-events: none;
        }

        .card.is-active .scrim {
            opacity: 1;
        }

        .meta {
            position: absolute;
            left: 0;
            bottom: 0;
            width: var(--w-active);
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 1rem;
            padding: 1.25rem;
            opacity: 0;
            transition: opacity var(--dur) var(--ease);
            pointer-events: none;
        }

        .card.is-active .meta {
            opacity: 1;
        }

        .meta h2 {
            margin: 0;
            font-size: 0.875rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: #ffffff;
            white-space: nowrap;
        }

        .meta p {
            margin: 0.25rem 0 0;
            font-size: 0.75rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.78);
            white-space: nowrap;
        }

        .meta .year {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.7);
            white-space: nowrap;
        }

        /* ---------- Tablet ---------- */

        @media (max-width: 1023px) {
            :root {
                --w-init: 1.75rem;
                --h-init: 11rem;
                --w-idle: 3.5rem;
                --h-idle: 14.5rem;
                --w-active: 18rem;
                --h-active: 18rem;
            }

            .bar {
                padding: 1.5rem;
            }

            .meta {
                padding: 1rem;
            }
        }

        /* ---------- Mobile: vertical accordion ---------- */

        @media (max-width: 767px) {
            :root {
                --w-init: 100%;
                --h-init: 3rem;
                --w-idle: 100%;
                --h-idle: 4rem;
                --w-active: 100%;
                --h-active: 20rem;
            }

            .gallery {
                flex-direction: column;
                max-width: 26rem;
            }

            .bar {
                font-size: 0.75rem;
                padding: 1.25rem;
            }

            .gallery-wrap {
                padding: 4rem 0.75rem;
            }

            .links {
                gap: 1rem;
            }

            .credit-label {
                display: none;
            }

            /* Collapsed rows still need to say which project they are. */
            .card:not(.is-active) .scrim {
                opacity: 1;
                background-image: linear-gradient(to right,
                        rgba(0, 0, 0, 0.75) 0%,
                        rgba(0, 0, 0, 0.45) 45%,
                        rgba(0, 0, 0, 0) 85%);
            }

            .card:not(.is-active) .meta {
                top: 0;
                opacity: 1;
                align-items: center;
                padding: 0 1.125rem;
            }

            .card:not(.is-active) .meta p,
            .card:not(.is-active) .meta .year {
                display: none;
            }
        }

        /* Short viewports (landscape phones, small laptop windows) */
        @media (min-width: 768px) and (max-height: 620px) {
            :root {
                --w-init: 1.5rem;
                --h-init: 10rem;
                --w-idle: 3rem;
                --h-idle: 13rem;
                --w-active: 16rem;
                --h-active: 16rem;
            }

            .bar {
                padding: 1rem 1.5rem;
            }
        }

        @media (min-width: 768px) and (max-height: 460px) {
            :root {
                --w-init: 1.25rem;
                --h-init: 7.5rem;
                --w-idle: 2.5rem;
                --h-idle: 9.5rem;
                --w-active: 12rem;
                --h-active: 12rem;
            }

            .bar {
                padding: 0.75rem 1.25rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .stage.ready .bar,
            .stage.ready .gallery,
            .stage.ready .card,
            .card img,
            .scrim,
            .meta {
                transition-duration: 0.01ms !important;
                transition-delay: 0ms !important;
            }

            .card.is-active:hover img {
                transform: none;
            }
        }
    </style>
</head>

<body>
    <div class="stage" id="stage">

        <header class="bar">
            <strong>Lee Sangyun</strong>
            <span>Product Designer</span>
        </header>

        <div class="gallery-wrap">
            <div class="gallery" id="gallery">

                <a class="card is-active" href="ocb.html">
                    <img src="thumbs/ocb.webp" width="1208" height="800" alt="OK캐쉬백 쇼핑 탭" decoding="async" fetchpriority="high">
                    <div class="scrim"></div>
                    <div class="meta">
                        <div>
                            <h2>OK캐쉬백 쇼핑 탭</h2>
                            <p>더 나은 선택을 발견하는 쇼핑경험</p>
                        </div>

                </a>

                <a class="card" href="olock.html">
                    <img src="thumbs/olock.webp" width="720" height="1040" alt="OLOCK 리브랜딩" decoding="async" referrerpolicy="no-referrer">
                    <div class="scrim"></div>
                    <div class="meta">

                        </div>

                </a>

                <a class="card" href="syrup.html">
                    <img src="thumbs/syrup.webp" width="800" height="932" alt="Syrup 야금야금" decoding="async" referrerpolicy="no-referrer">
                    <div class="scrim"></div>
                    <div class="meta">
                        <div>
                            <h2>Syrup 야금야금</h2>
                            <p>적립한 포인트로 야금야금 소액투자</p>

                <a class="card" href="mate.html">
                    <img src="thumbs/mate.webp" width="1226" height="747" alt="MATE" decoding="async">

                </a>

                <a class="card" href="gridsol.html">
                    <img src="thumbs/gridsol-mg.webp" width="1067" height="800" alt="Gridsol MG" decoding="async">
                    <div class="scrim"></div>
                    <div class="meta">
                        <div>
                            <h2>Gridsol MG</h2>

                    </div>
                </a>

                <a class="card" href="gridsol-hems.html">
                    <img src="thumbs/gridsol-hems.webp" width="801" height="800" alt="Gridsol HEMS" decoding="async">
                    <div class="scrim"></div>
                    <div class="meta">
                        <div>
                            <h2>Gridsol HEMS</h2>
                            <p>태양광 모니터링 시스템</p>
                        </div>
                        <span class="year">2015 — 2016</span>
                    </div>
                </a>

            </div>
        </div>

    </div>

    <script>
        (function () {
            var stage = document.getElementById('stage');
            var cards = Array.prototype.slice.call(document.querySelectorAll('.card'));
            var active = 0;

            function setActive(index) {
                if (index === active) return;
                active = index;
                for (var i = 0; i < cards.length; i++) {
                    cards[i].classList.toggle('is-active', i === active);
                }
            }

            cards.forEach(function (card, index) {
                // Hover expands on mouse only — touch taps fall through to the click handler.
                card.addEventListener('pointerenter', function (e) {
                    if (e.pointerType === 'mouse') setActive(index);
                });
                card.addEventListener('focus', function () {
                    setActive(index);
                });
                // First tap on a collapsed card expands it; a second tap follows the link.
                card.addEventListener('click', function (e) {
                    if (active !== index) {
                        e.preventDefault();
                        setActive(index);
                    }
                });
            });

            // Flush the initial styles so the transition has a state to animate from.
            // Done synchronously rather than via requestAnimationFrame, which never
            // fires in a background tab and would leave the page stuck at opacity 0.
            void stage.offsetHeight;
            stage.classList.add('ready');
        })();
    </script>
</body>

</html>
