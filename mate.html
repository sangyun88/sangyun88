<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATE — Lee Sangyun</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <script>document.documentElement.classList.add('js');</script>

    <style>
        :root {
            --bg: #f5f4f3;
            --ink: #111111;
            --muted: #6b7280;
            --ease: cubic-bezier(0.42, 0, 0.58, 1);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--ink);
            font-family: 'Inter', 'Pretendard', ui-sans-serif, system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .page {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
        }

        /* ---------- Bars ---------- */

        .bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
            flex: none;
            padding: 1.75rem 2rem;
            font-size: 0.8125rem;
            font-weight: 500;
            letter-spacing: -0.01em;
            color: var(--muted);
        }

        /* The intro only exists when scripting does, so the page is never
           stranded at opacity 0 if the script fails to run. */
        .js .page:not(.ready) header.bar {
            opacity: 0;
            transform: translateY(-8px);
        }

        .page.ready header.bar {
            transition: opacity 0.7s var(--ease), transform 0.7s var(--ease);
        }

        /* Nothing sits on the left any more, so keep the links on the right
           instead of letting space-between pull them across. */
        footer.bar {
            justify-content: flex-end;
        }

        .back {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--ink);
            text-decoration: none;
            transition: opacity 0.2s var(--ease);
        }

        .back:hover,
        .back:focus-visible {
            opacity: 0.6;
        }

        .back .ico {
            transition: transform 0.25s var(--ease);
        }

        .back:hover .ico {
            transform: translateX(-3px);
        }

        .project .year {
            color: var(--muted);
        }

        .project {
            color: var(--ink);
        }

        .links {
            display: flex;
            gap: 1.5rem;
        }

        .links a {
            color: var(--muted);
            text-decoration: none;
            transition: color 0.2s var(--ease);
        }

        .links a:hover,
        .links a:focus-visible {
            color: var(--ink);
        }

        .ico {
            width: 14px;
            height: 14px;
            flex: none;
        }

        .ico-lg {
            width: 22px;
            height: 22px;
        }

        /* ---------- Slides ---------- */

        .slides {
            flex: 1 1 auto;
            padding: 0 1.25rem;
        }

        /* One rounded surface around the whole run, so the slides stay
           edge-to-edge with each other the way the case study was laid out. */
        .slide-stack {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 80rem;
            margin: 0 auto;
            border-radius: 1.5rem;
            overflow: hidden;
            background-color: #e7e5e4;
        }

        .slide-stack img {
            display: block;
            width: 100%;
            height: auto;
        }

        /* ---------- Next project ---------- */

        .next {
            max-width: 80rem;
            width: 100%;
            margin: 0 auto;
            padding: 6rem 1.25rem 4rem;
        }

        .next-label {
            margin: 0 0 1.25rem;
            font-size: 0.6875rem;
            font-weight: 500;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .next-link {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--ink);
            text-decoration: none;
            font-size: clamp(1.5rem, 4vw, 2.25rem);
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .next-link .ico-lg {
            color: var(--muted);
            transition: transform 0.25s var(--ease), color 0.25s var(--ease);
        }

        .next-link:hover .ico-lg,
        .next-link:focus-visible .ico-lg {
            transform: translateX(5px);
            color: var(--ink);
        }

        @media (max-width: 767px) {
            .bar {
                font-size: 0.75rem;
                padding: 1.25rem;
            }

            .links {
                gap: 1rem;
            }

            .slides,
            .next {
                padding-left: 0.75rem;
                padding-right: 0.75rem;
            }

            .next {
                padding-top: 4rem;
                padding-bottom: 2.5rem;
            }

            .slide-stack {
                border-radius: 1rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .page.ready header.bar,
            .back,
            .back .ico,
            .links a,
            .next-link .ico-lg {
                transition-duration: 0.01ms !important;
            }

            .back:hover .ico,
            .next-link:hover .ico-lg {
                transform: none;
            }
        }
    </style>
</head>

<body>
    <div class="page" id="page">

        <header class="bar">
            <a class="back" href="index.html"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg> Lee Sangyun</a>
            <span class="project">MATE <span class="year">2018 — 2019</span></span>
        </header>

        <main class="slides">
            <div class="slide-stack">
                <img src="MATE/images/slide-1.png" alt="MATE 슬라이드 1" width="3840" height="2103" loading="eager" decoding="async">
                <img src="MATE/images/slide-2.png" alt="MATE 슬라이드 2" width="3840" height="2104" loading="lazy" decoding="async">
                <img src="MATE/images/slide-3.png" alt="MATE 슬라이드 3" width="3840" height="2104" loading="lazy" decoding="async">
                <img src="MATE/images/slide-4.png" alt="MATE 슬라이드 4" width="3840" height="2104" loading="lazy" decoding="async">
                <img src="MATE/images/slide-5.png" alt="MATE 슬라이드 5" width="3840" height="2104" loading="lazy" decoding="async">
                <img src="MATE/images/slide-6.png" alt="MATE 슬라이드 6" width="3840" height="2104" loading="lazy" decoding="async">
                <img src="MATE/images/slide-7.png" alt="MATE 슬라이드 7" width="3840" height="2104" loading="lazy" decoding="async">
                <img src="MATE/images/slide-8.png" alt="MATE 슬라이드 8" width="3840" height="2104" loading="lazy" decoding="async">
                <img src="MATE/images/slide-9.png" alt="MATE 슬라이드 9" width="3840" height="2104" loading="lazy" decoding="async">
                <img src="MATE/images/slide-10.png" alt="MATE 슬라이드 10" width="3840" height="2104" loading="lazy" decoding="async">
                <img src="MATE/images/slide-11.png" alt="MATE 슬라이드 11" width="3840" height="2103" loading="lazy" decoding="async">
            </div>
        </main>

        <section class="next">
            <p class="next-label">Next Project</p>
            <a class="next-link" href="gridsol.html">
                <span>Gridsol MG</span>
                <svg class="ico ico-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </a>
        </section>

    </div>

    <script>
        (function () {
            var page = document.getElementById('page');
            // Synchronous flush rather than requestAnimationFrame, which does not
            // fire in a background tab.
            void page.offsetHeight;
            page.classList.add('ready');
        })();
    </script>
</body>

</html>
